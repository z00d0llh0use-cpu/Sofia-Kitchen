name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build once and test these exact files
        run: |
          pnpm build
          pnpm test
          pnpm test:rules
          pnpm verify:artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish verified artifact to Firebase
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: firebase
      url: https://sofia-kitchen001.web.app/
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install deployment tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: website-${{ github.sha }}
          path: dist/
      - name: Verify artifact and reject outdated runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm verify:artifact
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/881629388333/locations/global/workloadIdentityPools/github-hosting/providers/github
          service_account: github-hosting@sofia-kitchen001.iam.gserviceaccount.com
          project_id: sofia-kitchen001
      - name: Record current version for rollback
        id: before
        run: node scripts/hosting-release.mjs before
      - name: Deploy Hosting only
        id: deploy
        run: pnpm exec firebase deploy --only hosting --project sofia-kitchen001 --non-interactive --message "commit $GITHUB_SHA; https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Record release and verify live files
        id: smoke
        run: |
          node scripts/hosting-release.mjs after
          node scripts/smoke-live.mjs
      - name: Restore previous version on deployment or smoke failure
        if: failure() && steps.before.outcome == 'success'
        run: node scripts/hosting-release.mjs rollback
      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .deployment/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
